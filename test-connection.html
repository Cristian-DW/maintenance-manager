<!DOCTYPE html>
<html>
<head>
    <title>Test Connection</title>
</head>
<body>
    <h1>Test Backend Connection</h1>
    <button onclick="testConnection()">Test Connection</button>
    <pre id="result"></pre>
    
    <script>
        async function testConnection() {
            const result = document.getElementById('result');
            result.textContent = 'Testing...';
            
            try {
                const auth = btoa('any:any');
                const response = await fetch('http://localhost:4004/odata/v4/maintenance/MaintenanceRequests', {
                    headers: {
                        'Authorization': `Basic ${auth}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                result.textContent = `✅ Success!\n\nSolicitudes encontradas: ${data.value?.length || 0}\n\n${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                result.textContent = `❌ Error: ${error.message}\n\n${error.stack}`;
            }
        }
    </script>
</body>
</html>
