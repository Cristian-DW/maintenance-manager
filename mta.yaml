---
_schema-version: '3.1'
ID: maintenance-manager
version: 1.0.0
description: Maintenance Manager Application for SAP BTP
parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
        - npm run build

modules:
  # Backend CAP Service
  - name: maintenance-manager-srv
    type: nodejs
    path: .
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: maintenance-manager-uaa
    properties:
      NODE_ENV: production

  # Frontend UI (Static Content)
  - name: maintenance-manager-ui
    type: static-file
    path: app/maintenance-manager-ui/dist
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build
      supported-platforms: []
    parameters:
      disk-quota: 128M
      memory: 128M
      routes:
        - route: ${default-uri}
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

resources:

  # XSUAA Authentication
  - name: maintenance-manager-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: maintenance-manager-${space}
        tenant-mode: dedicated
        role-collections:
          - name: MaintenanceManager_Admin
            description: Administrator
            role-template-references:
              - $XSAPPNAME.Admin
          - name: MaintenanceManager_Manager
            description: Manager
            role-template-references:
              - $XSAPPNAME.Manager
          - name: MaintenanceManager_Technician
            description: Technician
            role-template-references:
              - $XSAPPNAME.Technician
          - name: MaintenanceManager_Requester
            description: Requester
            role-template-references:
              - $XSAPPNAME.Requester